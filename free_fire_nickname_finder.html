<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free Fire Stylish Nickname Finder - generate and copy stylish gaming names.">
<title>Free Fire Stylish Nickname Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080b14;color:#fff;min-height:100vh}
.hero{padding:48px 20px 30px;text-align:center;background:radial-gradient(circle at top,#24335f,#080b14 65%)}
.badge{display:inline-block;padding:8px 14px;border:1px solid #5269ff;border-radius:999px;color:#aab6ff;font-size:13px}
h1{font-size:clamp(30px,6vw,58px);margin:18px 0 10px}.hero p{color:#aeb5c8;margin:0 auto 28px;max-width:650px}
.search{display:flex;max-width:720px;margin:auto;background:#111727;padding:8px;border:1px solid #303951;border-radius:16px}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:18px;padding:15px}.search button{border:0;border-radius:11px;padding:0 25px;background:#5865f2;color:white;font-weight:700;cursor:pointer}
main{max-width:1100px;margin:auto;padding:30px 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.toolbar span{color:#929ab0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#111727;border:1px solid #252e45;border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-size:20px;word-break:break-all}.copy{background:#202a42;color:#fff;border:1px solid #394767;border-radius:9px;padding:9px 12px;cursor:pointer}.copy:hover{background:#5865f2}.empty{text-align:center;padding:55px;color:#8992a8}
footer{text-align:center;color:#6f7890;padding:30px}
@media(max-width:560px){.search button{padding:0 15px}.name{font-size:17px}}
</style>
</head>
<body>
<section class="hero">
  <span class="badge">🎮 FREE FIRE TOOL</span>
  <h1>Stylish Nickname Finder</h1>
  <p>Enter your name and get 500+ stylish gaming nickname ideas. Tap Copy to use any name.</p>
  <div class="search">
    <input id="nameInput" placeholder="Enter your name..." maxlength="20" autocomplete="off">
    <button onclick="generate()">Generate</button>
  </div>
</section>
<main>
  <div class="toolbar"><strong id="title">Popular Stylish Names</strong><span id="count"></span></div>
  <div id="results" class="grid"></div>
</main>
<footer>Made for gamers • Stylish Nickname Finder<br><strong>Powered by MR. RANDOM</strong></footer>
<script>
const wrappers=[
 n=>`꧁༒☬${n}☬༒꧂`,n=>`亗 ${n} 亗`,n=>`『${n}』`,n=>`★彡[${n}]彡★`,
 n=>`乂 ${n} 乂`,n=>`×͜× ${n}`,n=>`么 ${n} 么`,n=>`꧁${n}꧂`,
 n=>`☠︎ ${n} ☠︎`,n=>`〆${n}〆`,n=>`ツ ${n} ツ`,n=>`◥꧁${n}꧂◤`,
 n=>`★${n}★`,n=>`『亗』${n}『亗』`,n=>`乂${n}メ`,n=>`⚡${n}⚡`,
 n=>`♛ ${n} ♛`,n=>`༺${n}༻`,n=>`☯ ${n} ☯`,n=>`✘ ${n} ✘`,
 n=>`彡${n}彡`,n=>`๛${n}๛`,n=>`࿐ ${n} ࿐`,n=>`• ${n} •`,
 n=>`乂『${n}』乂`,n=>`亗『${n}』亗`,n=>`★彡${n}彡★`,n=>`꧁༺${n}༻꧂`,
 n=>`༒ ${n} ༒`,n=>`☬ ${n} ☬`,n=>`⚔ ${n} ⚔`,n=>`♚${n}♚`,
 n=>`♤ ${n} ♤`,n=>`♛${n}♛`,n=>`☾ ${n} ☽`,n=>`✦ ${n} ✦`,
 n=>`✧${n}✧`,n=>`❖ ${n} ❖`,n=>`✰ ${n} ✰`,n=>`✯${n}✯`,
 n=>`★ ${n} ★`,n=>`☆ ${n} ☆`,n=>`✪ ${n} ✪`,n=>`✫${n}✫`,
 n=>`⚡ ${n} ⚡`,n=>`🔥 ${n} 🔥`,n=>`💀 ${n} 💀`,n=>`👑 ${n} 👑`
];
const prefixes=["亗","乂","メ","〆","ツ","么","彡","࿐","×͜×","☬","༒","⚡","★","♛","♚","☠︎","✦","✧","✰","❖","☯","⚔","♤","☾","•","々","乛","ミ","乂亗","꧁"];
const suffixes=["亗","乂","メ","〆","ツ","么","彡","࿐","×͜×","☬","༒","⚡","★","♛","♚","☠︎","✦","✧","✰","❖","☯","⚔","♤","☾","•","々","乛","ミ","亗乂","꧂"];
const transforms=[
 n=>n.toUpperCase(), n=>n.toLowerCase(),
 n=>n.split("").map((c,i)=>i%2?c.toLowerCase():c.toUpperCase()).join(""),
 n=>n.split("").reverse().join(""),
 n=>n.split("").join(" "),
 n=>n.split("").join("•"),
 n=>n.split("").join("丨")
];
function makeNames(raw){
 const n=raw.trim().replace(/[<>]/g,'')||"ANUJ";
 const out=[];
 for(const f of wrappers) out.push(f(n.toUpperCase()));
 for(const t of transforms){
   const x=t(n);
   for(const pre of prefixes) for(const suf of suffixes){
     if(out.length>=700) break;
     out.push(`${pre} ${x} ${suf}`);
   }
 }
 return [...new Set(out)].slice(0,500);
}

function clean(s){return s.trim().replace(/[<>]/g,'')}
function generate(){
 const raw=clean(document.getElementById('nameInput').value);
 const results=document.getElementById('results');
 if(!raw){showPopular();return}
 const names=makeNames(raw);
 document.getElementById('title').textContent=`Stylish Names for "${raw}"`;
 document.getElementById('count').textContent=`${names.length} names`;
 results.innerHTML=names.map(card).join('');
}
function card(name){return `<div class="card"><span class="name">${escapeHtml(name)}</span><button class="copy" onclick="copyName(this,'${escapeJs(name)}')">Copy</button></div>`}
function copyName(btn,name){
 navigator.clipboard.writeText(name).then(()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1000)})
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escapeJs(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
function showPopular(){
 const examples=['ANUJ','KING','PRO','GHOST','RAJA','DARK','OP','BOSS'];
 document.getElementById('title').textContent='Popular Stylish Names';
 document.getElementById('count').textContent='';
 document.getElementById('results').innerHTML=makeNames('ANUJ').slice(0,30).map(card).join('');
}
showPopular();
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')generate()});
</script>
</body>
</html>
